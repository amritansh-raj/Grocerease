<!DOCTYPE html>
<html lang="en">
<head>
    <title>Grocerease</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/style/style.css">
</head>
<body ng-app="grocerease" ui-view>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Grocerease</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
                <form class="d-flex search-bar">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-outline-success" type="submit" style="color: black;">Search</button>
                </form>
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item cart-Btn">
                            <a class="nav-link cart-Btn" ui-sref="Cart" style="background-color: #fe7b05; border-radius: 5px; color: white;">
                            <i class="bi bi-cart-fill"></i> Cart
                        </a>                    
                    </li>
                </ul>
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item login-Btn" ng-hide="userLoggedIn">
                        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
                            Login
                        </button>
                        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                            <div class="modal-dialog modal-dialog-centered">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h1 class="modal-title fs-5" id="exampleModalLabel">Welcome Back!!</h1>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                    </div>
                                    <div class="modal-body">
                                        <form ng-submit="submitLoginForm()" name="loginForm" novalidate>
                                            <div class="form-group">
                                                <label for="username">Username</label>
                                                <input type="text" class="form-control" id="username" aria-describedby="usernameHelp" placeholder="&#xF44F; Enter username" ng-model="loginData.username" required>
                                                <div class="text-danger" ng-show="loginForm.username.$error.required">Username is required.</div>
                                            </div>
                                            <div class="form-group">
                                                <label for="password">Password</label>
                                                <input type="password" class="form-control" id="password" placeholder="Password" ng-model="loginData.password" required>
                                                <div class="text-danger" ng-show="loginForm.password.$error.required">Password is required.</div>
                                            </div>
                                            <div class="modal-footer">
                                                <button type="submit" class="btn btn-primary">Submit</button>
                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                            </div>
                                        </form>
                                        <div class="text-center mt-2">
                                            Don't have an account? <button type="button" class="btn btn-link" ui-sref="register">Register</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                    </li>
                </ul>
                <!-- <ul class="navbar-nav ml-auto">
                    <li class="nav-item login-Btn" ng-show="userLoggedIn">
                        <a class="nav-link login-Btn" href="#" ng-click="logout()">
                            <i class="bi bi-box-arrow-right"></i> Logout
                        </a>
                    </li>
                </ul> -->
            </div>
          </div>
        </div>
      </nav>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.1.4/dist/sweetalert2.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular-ui-router/1.0.26/angular-ui-router.min.js"></script> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular-cookies/1.8.2/angular-cookies.min.js"></script>   
    <script src="script.js"></script>
</body>
</html>
