<!DOCTYPE html>
<html lang="en">
<head>
    <title>Grocerease</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style/index.css">
</head>
<body ng-app="grocerease" ui-view>
    <nav class="navbar navbar-expand-lg navbar-light bg-light"> 
        <div class="container-fluid">
            <a class="navbar-brand" href="#"> <img src="media/logo/leaves.png" alt="Grocerease" height="30px" width="200px"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <form class="d-flex search-bar">
                        <input class="form-control me-2" id="search-icon" type="search" placeholder="&#xF52A; Search" aria-label="Search">
                        <button class="btn btn-outline-success" id="search" type="submit">Search</button>
                    </form>
                </div>
                <div class="navbar-nav ms-auto">
                    <ul class="navbar-nav ml-auto">
                        <!-- <li class="nav-item category">
                            <div class="dropdown">
                                <button class="btn btn-secondary dropdown-toggle" ng-click="toggleDropdown()" aria-expanded="false">
                                    Dropdown link
                                </button>
                                <ul class="dropdown-menu" ng-show="isDropdownOpen">
                                    <li><a class="dropdown-item" href="#">Action</a></li>
                                    <li><a class="dropdown-item" href="#">Another action</a></li>
                                    <li><a class="dropdown-item" href="#">Something else here</a></li>
                                </ul>
                            </div>                            
                        </li> -->
                        <li class="nav-item cart-Btn">
                            <a class="nav-link cart-Btn" ui-sref="cart" style="background-color: #fe7b05; border-radius: 5px; color: white;">
                                <i class="bi bi-cart-fill"></i> Cart
                            </a>                    
                        </li>
                        <li class="nav-item login-Btn ms-3  mt-0" ng-hide="userLoggedIn">
                            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal" style="background-color: #fe7b05; border-color: #fe7b05;">
                                Login
                            </button>
                        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                            <div class="modal-dialog modal-dialog-centered">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h1 class="modal-title fs-5" id="exampleModalLabel">Welcome Back!!</h1>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                    </div>
                                    <div class="modal-body">
                                        <form ng-submit="submitLoginForm()" name="loginForm" novalidate>
                                            <div class="form-group">
                                                <label for="username">Username</label>
                                                <input type="text" class="form-control" id="username" aria-describedby="usernameHelp" placeholder="&#xF4DA; Enter username" ng-model="loginData.username" required>
                                                <div class="text-danger" ng-show="loginForm.username.$error.required">Username is required.</div>
                                            </div>
                                            <div class="form-group">
                                                <label for="password">Password</label>
                                                <input type="password" class="form-control" id="password" placeholder="&#xF44F; Password" ng-model="loginData.password" required>
                                                <div class="text-danger" ng-show="loginForm.password.$error.required">Password is required.</div>
                                            </div>
                                            <div class="modal-footer">
                                                <button type="submit" class="btn btn-primary">Submit</button>
                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                            </div>
                                        </form>
                                        <div class="text-center mt-2">
                                            Don't have an account? <button type="button" class="btn btn-link" ui-sref="register">Register</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>   
                    </li>
                
                
                    <li class="nav-item login-Btn" ng-show="userLoggedIn">
                        <a class="nav-link login-Btn" href="#" ng-click="logout()">
                            <i class="bi bi-box-arrow-right"></i> Logout
                        </a>
                    </li>
                    </ul>
                </div>
            </div>
        </div>
      </nav>

        <div class="container-fluid ng-scope">
            <div class="row">
                <div class="row d-flex justify-content-center align-items-center h-100">
                    <div class="col-md-10">

                        <div class="row posters mt-5">
                            <div class="col-md-4">
                                <img src="media/banners/Artboard 2.jpg" alt="">
                                <div class="sale">
                                    50% <br>off 
                                </div>
                            </div>
                            <div class="col-md-8">
                                <img src="media/banners/Artboard 3(1).png" alt="">
                            </div>
                        </div>

                        <div class="row featured ms-auto mt-5">
                            <div class="col-md-2 mb-3 d-flex justify-content-center" ng-repeat="product in products">
                                <div class="card" style="width: 14rem;">
                                    <img src="https://10.21.80.199:8000/media/{{ product.Image }}" class="card-img-top" alt="..." height="200" width="200">
                                    <div class="card-body">
                                      <h5 class="card-title">{{product.Product_name}}</h5>
                                      <p class="card-text">₹{{product.Price}}</p>
                                    </div>
                                    <div class="card-body d-flex justify-content-center">
                                        <button type="button" class="btn btn-primary btn-sm me-2">Buy now</button>
                                        <button type="button" class="btn btn-primary btn-sm" ng-click="addtocart(product)">Add to cart</button>
                                    </div>
                                </div>
                            </div> 
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <div class="footer mt-5" style="background-color: #f8f9fa;">
            <div class="foot-heading d-flex justify-content-center align-items-center">
                <img class="img-fluid mt-5" src="media/logo/leaves.png" alt="" height="50px" width="300px">
            </div>
            <footer class="py-3 my-4 footer" style="margin-top: 200px;">
                <ul class="nav justify-content-center border-bottom pb-3 mb-3">
                    <li class="nav-item"><a href="#" class="nav-link px-2 text-muted">Home</a></li>
                    <li class="nav-item"><a href="#" class="nav-link px-2 text-muted">Features</a></li>
                    <li class="nav-item"><a href="#" class="nav-link px-2 text-muted">Pricing</a></li>
                    <li class="nav-item"><a href="#" class="nav-link px-2 text-muted">FAQs</a></li>
                    <li class="nav-item"><a href="#" class="nav-link px-2 text-muted">About</a></li>
                </ul>
                <p class="text-center text-muted">© 2022 Company, Inc</p>
            </footer>    
        </div>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.1.4/dist/sweetalert2.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular-ui-router/1.0.26/angular-ui-router.min.js"></script> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular-cookies/1.8.2/angular-cookies.min.js"></script>   
    <script src="script.js"></script>
</body>
</html>
